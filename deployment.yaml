apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-transport-dashboard
  labels:
    app: public-transport-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: public-transport-dashboard
  template:
    metadata:
      labels:
        app: public-transport-dashboard
    spec:
      containers:
        - name: public-transport-dashboard
          image: shreemathi07/public-transport-dashboard:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: public-transport-dashboard-service
spec:
  type: NodePort
  selector:
    app: public-transport-dashboard
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081